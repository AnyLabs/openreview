name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true # Lint 失败不阻塞 CI

  build-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
            command: 'npm run dist:mac -- --publish never'
          - platform: 'ubuntu-latest'
            name: 'Linux-x64'
            command: 'npm run dist -- --publish never'
          - platform: 'windows-latest'
            name: 'Windows-x64'
            command: 'npm run dist:win -- --publish never'

    runs-on: ${{ matrix.platform }}
    name: Build Test (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Electron app (test only)
        run: ${{ matrix.command }}
